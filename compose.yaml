services:
  rucq:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${RUCQ_PORT:-8080}:8080"
    environment:
      DB_USER: root
      DB_PASSWORD: password
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: rucq
      RUCQ_ENV: "development"
      RUCQ_CORS_ALLOW_ORIGINS: "*"
      TRAQ_API_BASE_URL: "http://traq_server:3000/api/v3"
    env_file:
      - path: .env
        required: false
    depends_on:
      mariadb:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: .

  mariadb:
    image: mariadb:11.8.6-noble@sha256:78a5047d3ba33975f183f183c2464cc7f1eab13ec8667e57cc9a5821d6da7577
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: password
    volumes:
      - type: volume
        source: mariadb_data
        target: /var/lib/mysql
      - type: bind
        source: ./dev/db/
        target: /docker-entrypoint-initdb.d/
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      start_period: 10s
      interval: 5s
      timeout: 10s
      retries: 10

  swagger:
    image: swaggerapi/swagger-ui:v5.32.1
    ports:
      - "${SWAGGER_PORT:-8081}:8080"
    environment:
      SWAGGER_JSON: /openapi/openapi.yaml
    volumes:
      - type: bind
        source: ./
        target: /openapi/

  adminer:
    image: adminer:5.4.2@sha256:cc64d253db4f016cbcff2ff2f01e60ed07e74f38b4398f84d3c4fae4b5ce0e07
    ports:
      - "${ADMINER_PORT:-8082}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mariadb
    depends_on:
      mariadb:
        condition: service_healthy

  caddy:
    image: caddy:2.11.2-alpine@sha256:834468128c7696cec0ceea6172f7d692daf645ae51983ca76e39da54a97c570d
    env_file:
      - path: .env
        required: false
    ports:
      - ${CADDY_RUCQ_PORT:-3002}:3002
      - ${CADDY_RUCQ_ADMIN_PORT:-3003}:3003
      - ${CADDY_TRAQ_PORT:-3000}:3000
    volumes:
      - type: bind
        source: ./dev/caddy/
        target: /etc/caddy/
    depends_on:
      - rucq_ui
      - rucq_admin
      - traq_server
      - traq_ui

  rucq_ui:
    image: ghcr.io/traptitech/rucq-ui:1.2.5@sha256:5a0b617d766094caf41575855119a97286728f6b02a02f7f7873e01e679bb320
    expose:
      - 80

  rucq_admin:
    image: ghcr.io/traptitech/rucq-admin:1.0.0@sha256:5fb98cd1c3e48a5eb01dd52e64de9e66a934f757988c836b6b0721b51dff3509
    expose:
      - 80

  traq_server:
    image: ghcr.io/traptitech/traq:3.28.0@sha256:a5349a4f93e262093dbed54a1de02210aab64d9912b9a7217ac6a808067fb5f2
    environment:
      TRAQ_ALLOWSIGNUP: true
      TRAQ_MARIADB_HOST: mariadb
      TRAQ_STORAGE_LOCAL_DIR: /app/storage
    volumes:
      - type: volume
        source: traq_storage
        target: /app/storage
    ports:
      - "${TRAQ_SERVER_PORT:-3001}:3000"
    expose:
      - 3000
    depends_on:
      mariadb:
        condition: service_healthy

  traq_ui:
    image: ghcr.io/traptitech/traq-ui:3.31.3@sha256:4e65f52fb792ae9907711bb7084875f3bbab77f806a95278c9379cb3abf75671
    volumes:
      - type: volume
        source: traq_override
        target: /app/override
    expose:
      - 80

volumes:
  mariadb_data:
  traq_storage:
  traq_override:
